[project]
name = "viggo"
version = "0.1.0"
description = "A spoiler-free lore companion using RAG."
authors = [
    {name = "Marouan"}
]
readme = "README.md"
requires-python = "~3.12"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn[standard] (>=0.34.3,<0.35.0)",
    "pypdf (>=5.6.0,<6.0.0)",
    "ebooklib (>=0.18,<1.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "sentence-transformers (>=4.1.0,<5.0.0)",
    "elasticsearch (>=8.0.0,<9.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "groq (>=0.26.0,<0.27.0)",
    "neo4j (>=5.28.1,<6.0.0)",
    "spacy (>=3.8.7,<4.0.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "azure-search-documents (>=11.4.0,<12.0.0)",
    "mlflow",
    "wandb",
    "streamlit (>=1.50.0,<2.0.0)",
    "plotly (>=6.3.1,<7.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "streamlit-option-menu (>=0.4.0,<0.5.0)",
    "streamlit-aggrid (>=1.1.9,<2.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    
    
    
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.28.1"
pytest-cov = "^7.0.0"
ruff = "^0.13.2"
mypy = "^1.13.0"
bandit = "^1.7.10"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["viggo"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

