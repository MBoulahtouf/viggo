name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  multi-agent-tests:
    runs-on: ubuntu-latest
    name: Multi-Agent Framework Tests
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup uv with Caching
      uses: ./.github/actions/setup-uv
      with:
        python-version: '3.12'
        uv-version: 'latest'
        install-dev-deps: 'false'
    
    - name: Test Multi-Agent Core (No Dependencies)
      run: uv run python tests/test_multi_agent_core.py
    
    - name: Test Multi-Agent Standalone
      run: uv run python tests/test_multi_agent_standalone.py
    
    - name: Test Multi-Agent Framework (If Available)
      run: uv run python tests/test_multi_agent_framework.py
      continue-on-error: true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: [3.11, 3.12]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup uv with Caching
      uses: ./.github/actions/setup-uv
      with:
        python-version: ${{ matrix.python-version }}
        uv-version: 'latest'
        install-dev-deps: 'true'
    
    - name: Cache spaCy model
      uses: actions/cache@v3
      with:
        path: ~/.local/share/spacy
        key: spacy-${{ runner.os }}-${{ matrix.python-version }}-en_core_web_sm
    
    - name: Download spaCy model
      run: uv run python -m spacy download en_core_web_sm
    
    - name: Lint with ruff
      run: uv run ruff check .
    
    - name: Format check with ruff
      run: uv run ruff format --check .
    
    - name: Type check with mypy
      run: uv run mypy viggo/ --ignore-missing-imports
      continue-on-error: true  # Allow type checking to fail without failing the build
    
    - name: Test Multi-Agent Framework (Core)
      run: uv run python tests/test_multi_agent_core.py
    
    - name: Test Multi-Agent Framework (Standalone)
      run: uv run python tests/test_multi_agent_standalone.py
    
    - name: Test Core System
      run: uv run python tests/test_solid_architecture.py
    
    - name: Test with pytest (Full Suite)
      run: uv run pytest tests/ -v --cov=viggo --cov-report=xml --cov-report=term-missing --tb=short
      continue-on-error: true  # Allow some tests to fail while we fix them
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup uv with Caching
      uses: ./.github/actions/setup-uv
      with:
        python-version: '3.12'
        uv-version: 'latest'
        install-dev-deps: 'true'
    
    - name: Security check with bandit
      run: uv run bandit -r viggo/ -f json -o bandit-report.json
      continue-on-error: true  # Allow security check to fail without failing the build
    
    - name: Upload security report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [multi-agent-tests, test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup uv with Caching
      uses: ./.github/actions/setup-uv
      with:
        python-version: '3.12'
        uv-version: 'latest'
        install-dev-deps: 'false'
    
    - name: Build package
      run: uv build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/
