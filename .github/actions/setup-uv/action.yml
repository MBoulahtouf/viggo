name: 'Setup uv with Caching'
description: 'Install uv with optimized caching for ultra-fast CI builds'
inputs:
  python-version:
    description: 'Python version to use'
    required: true
    default: '3.12'
  uv-version:
    description: 'uv version to install'
    required: false
    default: 'latest'
  install-dev-deps:
    description: 'Whether to install dev dependencies'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true

    - name: Cache uv dependencies
      uses: actions/cache@v3
      with:
        path: |
          .venv
          ~/.cache/uv
        key: uv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('**/pyproject.toml', '**/poetry.lock') }}

    - name: Install dependencies
      shell: bash
      run: |
        if [ "${{ inputs.install-dev-deps }}" = "true" ]; then
          uv sync --all-extras
        else
          uv sync
        fi

